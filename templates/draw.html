{% extends 'base.html' %}

{% block title %}Draw Canvas - Scribble to Digital Converter{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-pencil-ruler me-2"></i>Drawing Canvas</h5>
                <div>
                    <button class="btn btn-light btn-sm me-2" onclick="clearCanvas()"><i class="fas fa-trash me-1"></i>Clear</button>
                    <button class="btn btn-light btn-sm me-2" onclick="undoCanvas()"><i class="fas fa-undo me-1"></i>Undo</button>
                    <button class="btn btn-success btn-sm" onclick="downloadDrawing()"><i class="fas fa-download me-1"></i>Download</button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="canvas-wrapper p-4 text-center bg-light">
                    <canvas id="drawCanvas" width="800" height="500" class="border rounded shadow-inner"></canvas>
                </div>
            </div>
            <div class="card-footer bg-white d-flex flex-wrap gap-2 p-3">
                <div class="d-flex align-items-center gap-3">
                    <label class="form-label mb-0">Tool:</label>
                    <button type="button" class="btn btn-outline-primary btn-sm tool-btn active" data-tool="pencil"><i class="fas fa-pencil-alt"></i> Pencil</button>
                    <button type="button" class="btn btn-outline-primary btn-sm tool-btn" data-tool="eraser"><i class="fas fa-eraser"></i> Eraser</button>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <label class="form-label mb-0">Brush Size:</label>
                    <input type="range" id="brushSize" min="1" max="30" value="5" class="form-range" style="width:150px;">
                    <span id="sizeVal" class="badge bg-primary">5</span>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <label class="form-label mb-0">Color:</label>
                    <input type="color" id="drawColor" value="#000000" class="form-control-color">
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/canvas.js') }}"></script>
{% endblock %}
